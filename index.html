<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui Console - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu-bar">
        <a href="index.html" class="menu-item active">Home</a>
        <a href="sobre.html" class="menu-item">Sobre</a>
        <a href="servicos.html" class="menu-item">Serviços</a>
        <a href="contato.html" class="menu-item">Contato</a>
    </nav>

    <div class="window">
        <div class="window-header">
            <span>System_Welcome.exe</span>
            <span>[X]</span>
        </div>
        <div class="window-content">
            <h1>Bem-vindo ao Console Brayan & Enzo</h1>
            <p>Iniciando sistema de portfólio interativo...</p>
            <p style="color: #00ff00;">[OK] Assets carregados</p>
            <p style="color: #00ff00;">[OK] Interface ImGui ativa</p>
        </div>
    </div>

    <div class="window">
        <div class="window-header">
            <span>Image_Preview_Buffer</span>
            <span>[-]</span>
        </div>
        <div class="window-content">
            <div class="carousel-container">
                <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800" class="carousel-img active">
                <img src="https://images.unsplash.com/photo-1504384308090-c894fdcc538d?w=800" class="carousel-img">
                <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800" class="carousel-img">
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="imgui-modal" class="window imgui-modal">
        <div class="window-header">
            <span id="modal-title">System Message</span>
            <span id="modal-close" style="cursor:pointer;">[X]</span>
        </div>
        <div class="window-content" id="modal-body"></div>
    </div>

    <footer>
        <div>System v2.0.4</div>
        <div class="credits">
            Criado por: 
            <span class="creator-link" data-name="Brayan" data-turma="2ºB Mat" data-numero="5">Brayan</span> & 
            <span class="creator-link" data-name="Enzo" data-turma="2ºB Mat" data-numero="14">Enzo</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
