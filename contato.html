<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Projeto Brayan & Enzo</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="menu-btn"><i class="fas fa-bars"></i></div>
    
    <nav class="sidebar">
        <div class="close-btn"><i class="fas fa-times"></i></div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="servicos.html">Serviços</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
    </nav>

    <header>
        <h1 class="hero-title wave-text"></h1>
    </header>

    <main class="container">
        <div class="card contact-form">
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Seu nome" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Mensagem</label>
                    <textarea id="message" rows="5" placeholder="Como podemos ajudar?" required></textarea>
                </div>
                <button type="submit" class="btn-submit">Enviar Mensagem</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-names">
            <span>Brayan <i class="fas fa-star"></i></span>
            <span>Enzo <i class="fas fa-heart"></i></span>
        </div>
        <p>&copy; <span id="currentYear"></span> - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
