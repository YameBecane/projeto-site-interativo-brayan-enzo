<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui Console - Contato</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu-bar">
        <a href="index.html" class="menu-item">Home</a>
        <a href="sobre.html" class="menu-item">Sobre</a>
        <a href="servicos.html" class="menu-item">Serviços</a>
        <a href="contato.html" class="menu-item active">Contato</a>
    </nav>

    <div class="window" style="max-width: 600px; margin: 0 auto;">
        <div class="window-header"><span>Send_Message.sh</span></div>
        <div class="window-content">
            <form id="contact-form">
                <label>NOME_USUARIO:</label>
                <input type="text" required placeholder="Digite seu nome...">
                <label>EMAIL_CONTATO:</label>
                <input type="email" required placeholder="usuario@dominio.com">
                <label>MENSAGEM_BUFFER:</label>
                <textarea rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                <button type="submit" class="imgui-btn">ENVIAR_PACOTE</button>
            </form>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="imgui-modal" class="window imgui-modal">
        <div class="window-header">
            <span id="modal-title">System Message</span>
            <span id="modal-close" style="cursor:pointer;">[X]</span>
        </div>
        <div class="window-content" id="modal-body"></div>
    </div>

    <footer>
        <div>System v2.0.4</div>
        <div class="credits">
            Criado por: 
            <span class="creator-link" data-name="Brayan" data-turma="2ºB Mat" data-numero="5">Brayan</span> & 
            <span class="creator-link" data-name="Enzo" data-turma="2ºB Mat" data-numero="14">Enzo</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
