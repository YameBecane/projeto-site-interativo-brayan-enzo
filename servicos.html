<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImGui Console - Serviços</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="menu-bar">
        <a href="index.html" class="menu-item">Home</a>
        <a href="sobre.html" class="menu-item">Sobre</a>
        <a href="servicos.html" class="menu-item active">Serviços</a>
        <a href="contato.html" class="menu-item">Contato</a>
    </nav>

    <div class="window">
        <div class="window-header"><span>Available_Modules.list</span></div>
        <div class="window-content">
            <div class="grid-2">
                <div class="window">
                    <div class="window-header"><span>Module_01</span></div>
                    <div class="window-content">
                        <h4>Web Development</h4>
                        <button class="imgui-btn svc-btn" data-svc="Web Development" style="margin-top:10px;">Executar</button>
                    </div>
                </div>
                <div class="window">
                    <div class="window-header"><span>Module_02</span></div>
                    <div class="window-content">
                        <h4>UI/UX Design</h4>
                        <button class="imgui-btn svc-btn" data-svc="UI/UX Design" style="margin-top:10px;">Executar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay"></div>
    <div id="imgui-modal" class="window imgui-modal">
        <div class="window-header">
            <span id="modal-title">System Message</span>
            <span id="modal-close" style="cursor:pointer;">[X]</span>
        </div>
        <div class="window-content" id="modal-body"></div>
    </div>

    <footer>
        <div>System v2.0.4</div>
        <div class="credits">
            Criado por: 
            <span class="creator-link" data-name="Brayan" data-turma="2ºB Mat" data-numero="5">Brayan</span> & 
            <span class="creator-link" data-name="Enzo" data-turma="2ºB Mat" data-numero="14">Enzo</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
